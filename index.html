<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Hold Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#65707c;--bd:#dde1e6;--ac:#2255d4;--ok:#137a3f;--okb:#e2f4e9;--no:#b3261e;--nob:#fce9e7;--wa:#8a5a00;--wab:#fff0cf;--gr:#555;--grb:#eceef1}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2126;--tx:#e8eaed;--mu:#9aa4af;--bd:#333a42;--ac:#7aa2ff;--ok:#6fd59a;--okb:#173324;--no:#ff8f86;--nob:#3a1d1a;--wa:#f3c56a;--wab:#3a2e12;--gr:#b4bcc5;--grb:#2a2f35}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:18px 0 8px}a{color:var(--ac)}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tabs{display:flex;gap:4px;background:var(--grb);padding:3px;border-radius:9px;width:max-content;margin-bottom:12px}
.tabs button{border:0;background:none;color:var(--mu);padding:6px 12px;border-radius:7px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--tx);font-weight:600}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:6px 8px;min-width:0}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:7px;padding:6px 11px;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.ok{color:var(--ok);border-color:var(--ok)}.btn.no{color:var(--no);border-color:var(--no)}.btn.s{padding:3px 8px;font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.auth{max-width:400px;margin:30px auto}.auth .btn.p{width:100%;margin:12px 0 8px}
.fl{display:block;margin:8px 0 0;font-size:12px;color:var(--mu)}.fl input,.fl select{width:100%;margin-top:3px;font-size:14px;color:var(--tx)}
.err{color:var(--no);margin-top:6px;min-height:1em}.okm{color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grow{flex:1 1 160px}
.mu{color:var(--mu);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.stat b{display:block;font-size:22px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--grb);color:var(--gr)}
.chip.approved,.chip.active{background:var(--okb);color:var(--ok)}.chip.denied,.chip.expired,.chip.disabled{background:var(--nob);color:var(--no)}.chip.pending,.chip.partial{background:var(--wab);color:var(--wa)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mu);font-weight:600}
.line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.bar{background:var(--wab);color:var(--wa);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px;word-break:break-word}
.empty{text-align:center;color:var(--mu);padding:22px}
</style></head><body><main>
<div id="bar"></div><div id="auth"></div>
<div id="app" hidden>
<div class="top"><h1>📦 Stock Hold Manager</h1><div class="row"><span id="who" class="mu"></span><button class="btn s" data-act="logout">Log out</button></div></div>
<div id="tabs"></div><div id="shell"></div><div id="data"></div></div>
</main>
<script>
// ====== FILL THESE IN from Supabase → Project Settings → API ======
const SUPABASE_URL = 'https://mooumqjkxggzfpxqusne.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_UrQmObPW7tjdb2KJn9Bzag_vpn2Stsi';
// ====================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const dl=u=>Math.round((new Date(u+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const fmt=u=>new Date(u+'T00:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});
const ROLES={requester:'Requester',pm:'Product Manager',admin:'Admin'};
const g=id=>{const e=$('#'+id);return e?e.value.trim():''};
const banner=t=>{$('#bar').innerHTML=t?'<div class="bar">'+esc(t)+'</div>':''};
const authMsg=(t,ok)=>{const m=$('#am');if(m){m.textContent=t;m.className='err'+(ok?' okm':'')}};
let me=null,rows=[],accts=[],atab='holds',filt={q:'',st:''};

// ---------- auth screens ----------
const F=(id,l,t)=>`<label class="fl">${l}<input id="${id}" type="${t||'text'}"></label>`;
function showAuth(v,msg,ok){$('#app').hidden=true;const a=$('#auth');a.hidden=false;a.innerHTML='';let h='';
  if(v==='login')h=`<h2>Sign in</h2>${F('u','Work email')}${F('p','Password','password')}<button class="btn p" data-act="login">Log in</button><div class="row"><a href="#" data-act="go" data-v="forgot">Forgot password?</a><a href="#" data-act="go" data-v="signup">Create account</a></div>`;
  if(v==='signup')h=`<h2>Create account</h2><label class="fl">Account type<select id="role"><option value="requester">Requester</option><option value="pm">Product Manager</option></select></label>
  ${F('fn','Full name')}<div class="rq">${F('div','Division')}${F('area','Area')}${F('sm','Name of sales manager')}</div><div class="pm" hidden>${F('bu','BU #')}${F('pos','Position')}</div>
  ${F('un','Username')}${F('u','Work email')}${F('p','Password','password')}${F('p2','Confirm password','password')}<div class="mu">6+ characters (Supabase minimum).</div>
  <button class="btn p" data-act="signup">Submit for approval</button><a href="#" data-act="go" data-v="login">← Back to sign in</a>`;
  if(v==='forgot')h=`<h2>Forgot password</h2>${F('u','Work email')}<button class="btn p" data-act="fp">Send reset link</button><a href="#" data-act="go" data-v="login">← Back to sign in</a>`;
  if(v==='newpw')h=`<h2>Choose a new password</h2>${F('p','New password','password')}${F('p2','Confirm password','password')}<button class="btn p" data-act="setpw">Save password</button>`;
  a.innerHTML=`<div class="card auth">${h}<div id="am" class="err"></div></div>`;if(msg)authMsg(msg,ok);const f=a.querySelector('input');f&&f.focus()}

document.addEventListener('change',e=>{if(e.target.id==='role'){document.querySelector('.rq').hidden=e.target.value!=='requester';document.querySelector('.pm').hidden=e.target.value!=='pm'}});

async function signup(){
  const role=g('role'),email=g('u'),p=$('#p').value,fn=g('fn'),un=g('un');
  const det=role==='requester'?{division:g('div'),area:g('area'),sales_manager:g('sm')}:{bu:g('bu'),position:g('pos')};
  if(!email||!fn||!un||Object.values(det).some(v=>!v))return authMsg('Please complete every field.');
  if(p!==$('#p2').value)return authMsg('Passwords do not match.');
  const {data,error}=await sb.auth.signUp({email,password:p});
  if(error)return authMsg(error.message);
  const uid=data.user&&data.user.id;
  if(!uid)return authMsg('Check your inbox to confirm your email, then log in.',1);
  const {error:pe}=await sb.from('profiles').insert({id:uid,username:un,full_name:fn,role,status:'pending',...det});
  if(pe)return authMsg(pe.message.includes('duplicate')?'That username or email is already registered.':pe.message);
  showAuth('login','Account submitted. An Admin must approve it before you can log in.',1)}

async function login(){
  const email=g('u'),p=$('#p').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password:p});
  if(error)return authMsg('Invalid email or password.');
  const {data:prof,error:pe}=await sb.from('profiles').select('*').eq('id',data.user.id).single();
  if(pe||!prof){await sb.auth.signOut();return authMsg('No profile found for this account. Contact an Admin.')}
  if(prof.status!=='active'){await sb.auth.signOut();return authMsg(prof.status==='disabled'?'This account is disabled. Contact an Admin.':'Your account is awaiting Admin approval.')}
  me=prof;enter()}
async function forgot(){const email=g('u');if(!email)return authMsg('Enter your work email.');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});
  authMsg(error?error.message:'If that email is registered, a reset link has been sent.',!error)}
async function setNewPw(){const p=$('#p').value;if(p!==$('#p2').value)return authMsg('Passwords do not match.');
  const {error}=await sb.auth.updateUser({password:p});
  if(error)return authMsg(error.message);showAuth('login','Password updated. Log in with your new password.',1)}

// ---------- session ----------
function enter(){$('#auth').hidden=true;$('#auth').innerHTML='';$('#app').hidden=false;banner('');atab='holds';
  $('#who').textContent=me.full_name+' · '+ROLES[me.role];
  loadHolds();shell()}
async function logout(msg){await sb.auth.signOut();me=null;rows=[];banner('');showAuth('login',msg,1)}
const need=(...r)=>{if(!me||!r.includes(me.role))throw Error('You do not have permission to do that.')};

async function loadHolds(){
  const {data,error}=await sb.from('holds').select('*, hold_items(*)').order('created_at',{ascending:false});
  if(error)return banner('Could not load holds: '+error.message);
  rows=data.map(r=>({id:r.id,ref:r.ref,group:r.group_name,until:r.until,reason:r.reason,requester_id:r.requester_id,createdAt:new Date(r.created_at).getTime(),
    items:r.hold_items.map(i=>({id:i.id,code:i.code,qty:i.qty,remarks:i.remarks,st:i.status,decided_by:i.decided_by,decided_at:i.decided_at,note:i.note}))}));
  if(me)data_();}
async function loadAccts(){const {data,error}=await sb.from('profiles').select('*').order('created_at');
  if(error)return banner('Could not load accounts: '+error.message);accts=data;if(me&&atab==='accounts')data_()}

// ---------- workflow (unchanged behaviour) ----------
const lineSt=(r,l)=>l.st==='approved'&&dl(r.until)<0?'expired':l.st;
const reqSt=r=>{const s=r.items.map(l=>l.st);if(s.includes('pending'))return 'pending';if(s.every(x=>x==='denied'))return 'denied';if(s.every(x=>x==='released'))return 'released';return s.includes('denied')?'partial':'approved'};
const chip=s=>'<span class="chip '+s+'">'+s+'</span>';
function tabs(){$('#tabs').innerHTML=me.role==='admin'?'<div class="tabs">'+[['holds','Holds'],['accounts','Accounts']].map(([k,v])=>`<button data-tab="${k}" class="${k===atab?'on':''}">${v}</button>`).join('')+'</div>':''}
function shell(){tabs();const s=$('#shell');
  if(me.role==='requester'){s.innerHTML=`<div class="card"><h2 style="margin-top:0">New hold request</h2>
  <div class="row"><input id="grp" class="grow" list="grps" placeholder="Group / brand (e.g. LENOVO-NB)"><datalist id="grps"><option>LENOVO-NB</option><option>LENOVO-LN</option></datalist>
  <label class="mu">Hold until <input id="until" type="date" min="${today()}" value="${plus(4)}"></label><input id="why" class="grow" placeholder="Reason" value="Part of Order Plan"></div>
  <div id="lines" style="margin-top:8px"></div><div class="row" style="margin-top:8px"><button class="btn s" data-act="addline">+ Add item</button><button class="btn p" data-act="submit">Submit for approval</button><span id="msg" class="mu"></span></div></div>`;addLine()}
  else if(me.role==='admin'&&atab==='holds'){s.innerHTML=`<div id="stats"></div><div class="row" style="margin-bottom:8px"><input id="q" class="grow" placeholder="Search item code, ref, requester…" value="${esc(filt.q)}">
  <select id="st"><option value="">All statuses</option>${['pending','approved','expired','denied','released'].map(x=>`<option${filt.st===x?' selected':''}>${x}</option>`).join('')}</select><button class="btn" data-act="csv">⬇ Export CSV</button></div>`}
  else if(me.role==='admin'){s.innerHTML=`<div class="card"><b>Pending / all accounts</b> <span class="mu">— approve, disable or promote to Admin</span></div>`;loadAccts()}
  else s.innerHTML='';data_()}
function addLine(){const d=document.createElement('div');d.className='line';
  d.innerHTML='<input class="grow c" placeholder="Item code / description"><input class="q" type="number" min="1" placeholder="Qty" style="width:80px"><input class="grow m" placeholder="Remarks (optional)">';$('#lines').appendChild(d)}
function data_(){if(!me)return;const d=$('#data');
  if(me.role==='requester'){const mine=rows.filter(r=>r.requester_id===me.id);d.innerHTML='<h2>My requests</h2>'+(mine.length?mine.slice(0,20).map(reqCard).join(''):'<div class="empty">No requests yet.</div>')}
  else if(me.role==='pm'){const p=rows.filter(r=>reqSt(r)==='pending');d.innerHTML='<h2>Waiting for approval ('+p.length+')</h2>'+(p.length?p.map(pmCard).join(''):'<div class="empty">Nothing pending 🎉</div>')}
  else if(atab==='accounts')acctData(d);else adminData(d)}
const age=r=>{const n=Math.floor((Date.now()-r.createdAt)/864e5);return n>0?n+'d waiting':'today'};
function reqCard(r){return `<div class="card"><div class="row"><b>${esc(r.ref)}</b> ${esc(r.group)} ${chip(reqSt(r))}<span class="mu">until ${fmt(r.until)}</span></div>`+
  r.items.map(l=>`<div class="line"><span class="grow">${esc(l.code)}</span><b>${esc(l.qty)}</b><span class="mu">${esc(l.remarks)}${l.note?' · PM: '+esc(l.note):''}</span>${chip(lineSt(r,l))}</div>`).join('')+'</div>'}
function pmCard(r){return `<div class="card"><div class="row"><b>${esc(r.ref)}</b> ${esc(r.group)}<span class="mu">hold until ${fmt(r.until)} · ${esc(r.reason)} · ${age(r)}</span></div>`+
  r.items.map(l=>`<div class="line"><span class="grow">${esc(l.code)}</span><b>${esc(l.qty)}</b><span class="mu">${esc(l.remarks)}</span>`+
  (l.st==='pending'?`<button class="btn s ok" data-act="dec" data-id="${l.id}" data-v="approved">Approve</button><button class="btn s no" data-act="dec" data-id="${l.id}" data-v="denied">Deny</button>`:chip(l.st))+'</div>').join('')+
  `<div class="row" style="margin-top:8px"><input id="note-${r.id}" class="grow" placeholder="Note to requester (optional)"><button class="btn ok" data-act="decall" data-id="${r.id}" data-v="approved">Approve all</button><button class="btn no" data-act="decall" data-id="${r.id}" data-v="denied">Deny all</button></div></div>`}
function flat(){return rows.flatMap(r=>r.items.map(l=>({r,l,st:lineSt(r,l)})))}
function adminData(d){const all=flat(),act=all.filter(x=>x.st==='approved');
  $('#stats').innerHTML=`<div class="stats"><div class="card stat"><b>${act.reduce((a,x)=>a+(+x.l.qty||0),0)}</b><span class="mu">units on hold now</span></div><div class="card stat"><b>${all.filter(x=>x.st==='pending').length}</b><span class="mu">lines awaiting approval</span></div><div class="card stat"><b>${act.filter(x=>dl(x.r.until)<=2).length}</b><span class="mu">expiring in ≤2 days</span></div><div class="card stat"><b>${all.filter(x=>x.st==='expired').length}</b><span class="mu">expired, not released</span></div></div>`;
  const q=filt.q.toLowerCase(),list=all.filter(x=>(!filt.st||x.st===filt.st)&&(!q||(x.l.code+x.r.ref+x.r.group).toLowerCase().includes(q)));
  const sku={};act.forEach(x=>sku[x.l.code]=(sku[x.l.code]||0)+(+x.l.qty||0));
  d.innerHTML=`<div class="card scroll"><table><tr><th>Ref</th><th>Item code</th><th>Qty</th><th>Hold until</th><th>Status</th><th></th></tr>`+
  (list.length?list.map(x=>{const n=dl(x.r.until),live=x.st==='approved'||x.st==='expired';return `<tr><td>${esc(x.r.ref)}<div class="mu">${esc(x.r.group)}</div></td><td>${esc(x.l.code)}<div class="mu">${esc(x.l.remarks)}</div></td><td><b>${esc(x.l.qty)}</b></td><td>${fmt(x.r.until)}<div class="mu">${live?(n<0?-n+'d overdue':n+'d left'):''}</div></td><td>${chip(x.st)}</td>
  <td>${live?`<button class="btn s" data-act="release" data-id="${x.l.id}">Release</button> <button class="btn s" data-act="rehold" data-rid="${x.r.id}" data-code="${esc(x.l.code)}" data-qty="${x.l.qty}">Rehold</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">No matching holds.</td></tr>')+
  `</table></div><h2>Reserved per item code (active holds)</h2><div class="card">`+(Object.keys(sku).length?Object.entries(sku).map(([k,v])=>`<div class="line"><span class="grow">${esc(k)}</span><b>${v}</b></div>`).join(''):'<span class="mu">None</span>')+'</div>';window._list=list}
function acctData(d){d.innerHTML='<div class="card scroll"><table><tr><th>Username</th><th>Name</th><th>Role</th><th>Details</th><th>Status</th><th></th></tr>'+accts.map(a=>{
  const det=a.role==='pm'?'BU '+(a.bu||'')+' · '+(a.position||''):(a.division||'')+' · '+(a.area||'')+' · Mgr: '+(a.sales_manager||'');
  const b=(v,t,c)=>`<button class="btn s ${c||''}" data-act="acct" data-id="${a.id}" data-v="${v}">${t}</button> `;
  return `<tr><td>${esc(a.username)}</td><td>${esc(a.full_name)}</td><td>${ROLES[a.role]}</td><td class="mu">${esc(det)}</td><td>${chip(a.status)}</td><td>`+
  (a.status==='pending'?b('active','Approve','ok')+b('disabled','Reject','no'):a.status==='active'?b('disabled','Disable','no')+(a.role!=='admin'?b('promote','Make Admin'):''):b('active','Enable','ok'))+
  `<button class="btn s no" data-act="delacct" data-id="${a.id}">Delete</button></td></tr>`}).join('')+'</table></div>'}
async function acct(id,v){need('admin');const patch=v==='promote'?{role:'admin',status:'active'}:{status:v};
  const {error}=await sb.from('profiles').update(patch).eq('id',id);if(error)return banner(error.message);await loadAccts()}
async function delAcct(id){need('admin');if(!confirm('Delete this account? This does not remove their sign-in, only their profile.'))return;
  const {error}=await sb.from('profiles').delete().eq('id',id);if(error)return banner(error.message);await loadAccts()}

const newRef=()=>'HS-'+today().replace(/-/g,'').slice(2)+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
async function submit(){need('requester');const gp=g('grp'),u=g('until'),why=g('why'),m=$('#msg');
  const items=[...document.querySelectorAll('#lines .line')].map(d=>({code:d.querySelector('.c').value.trim(),qty:Math.floor(+d.querySelector('.q').value),remarks:d.querySelector('.m').value.trim()})).filter(x=>x.code&&x.qty>0);
  if(!gp||!u||dl(u)<0||!items.length){m.textContent='Add a group, a valid date and at least one item with a quantity.';return}
  const {data:hold,error}=await sb.from('holds').insert({ref:newRef(),group_name:gp,until:u,reason:why,requester_id:me.id}).select().single();
  if(error)return m.textContent='Could not submit: '+error.message;
  const {error:ie}=await sb.from('hold_items').insert(items.map(x=>({hold_id:hold.id,...x})));
  if(ie)return m.textContent='Could not save items: '+ie.message;
  shell();$('#msg').textContent='Submitted ✔'}
async function decide(itemId,v){need('pm');const {error}=await sb.from('hold_items').update({status:v,decided_by:me.id,decided_at:new Date().toISOString()}).eq('id',itemId);
  if(error)return banner(error.message);await loadHolds()}
async function decideAll(holdId,v){need('pm');const r=rows.find(x=>x.id===holdId),note=($('#note-'+holdId)||{}).value||'';
  const ids=r.items.filter(l=>l.st==='pending').map(l=>l.id);
  const {error}=await sb.from('hold_items').update({status:v,decided_by:me.id,decided_at:new Date().toISOString(),note}).in('id',ids);
  if(error)return banner(error.message);await loadHolds()}
async function release(itemId){need('admin');const {error}=await sb.from('hold_items').update({status:'released'}).eq('id',itemId);if(error)return banner(error.message);await loadHolds()}
async function rehold(rid,code,qty){need('admin');const r=rows.find(x=>x.id===rid);
  const {data:h,error}=await sb.from('holds').insert({ref:newRef(),group_name:r.group,until:plus(7),reason:r.reason,requester_id:r.requester_id}).select().single();
  if(error)return banner(error.message);
  await sb.from('hold_items').insert({hold_id:h.id,code,qty,remarks:'REHOLD'});
  banner('Rehold request created (7 days) and sent to the Product Manager queue.');await loadHolds()}
function csv(){need('admin');const list=window._list||[];
  const H=['Ref','Group','Item code','Qty','Remarks','Hold until','Status'];
  const q=v=>{v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const body=list.map(x=>[x.r.ref,x.r.group,x.l.code,x.l.qty,x.l.remarks,x.r.until,x.st].map(q).join(','));
  const blob=new Blob(['\ufeff'+[H.map(q).join(','),...body].join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stock-holds-'+today()+'.csv';a.click()}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;if(t.tagName==='A')e.preventDefault();
  try{if(t.dataset.tab){atab=t.dataset.tab;banner('');return shell()}
  const a=t.dataset.act,{id,v,rid,code,qty}=t.dataset;
  if(a==='go')return showAuth(v);if(a==='login')return await login();if(a==='signup')return await signup();
  if(a==='fp')return await forgot();if(a==='setpw')return await setNewPw();if(a==='logout')return await logout('You have been logged out.');
  if(a==='addline')addLine();else if(a==='submit')await submit();else if(a==='dec')await decide(id,v);else if(a==='decall')await decideAll(id,v);
  else if(a==='release')await release(id);else if(a==='rehold')await rehold(rid,code,+qty);else if(a==='csv')csv();
  else if(a==='acct')await acct(id,v);else if(a==='delacct')await delAcct(id);
  }catch(err){banner('Action failed: '+(err.message||err))}});
document.addEventListener('input',e=>{if(e.target.id==='q'){filt.q=e.target.value;data_()}});
document.addEventListener('change',e=>{if(e.target.id==='st'){filt.st=e.target.value;data_()}});

// ---------- boot: also handles the password-recovery link Supabase redirects back to ----------
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showAuth('newpw')});
  if(session){const {data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
    if(prof&&prof.status==='active'){me=prof;return enter()}}
  showAuth('login');
})();
</script></body></html>
